<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>필름정리</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="필름정리">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* iOS 기본 앱 스타일: 그룹 목록, 시스템 글꼴, 시스템 색 */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --ink:#000000; --muted:rgba(60,60,67,.6); --faint:rgba(60,60,67,.3); --line:rgba(60,60,67,.18);
  --tint:#007AFF; --seg:#FFFFFF;
  --bw:#8E8E93; --c41:#FF9500; --e6:#30B0C7; --ecn:#FF3B30; --late:#FF3B30; --soon:#FF9500; --ok:#34C759;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1C1C1E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3); --line:rgba(84,84,88,.6);
  --tint:#0A84FF; --seg:#636366;
  --bw:#98989D; --c41:#FF9F0A; --e6:#40C8E0; --ecn:#FF453A; --late:#FF453A; --soon:#FF9F0A; --ok:#30D158;
  color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.3;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit}
input,textarea{font:inherit}
.edge{font-size:13px;color:var(--muted);letter-spacing:0}

/* 상단 바 + 큰 제목 */
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:flex-end;gap:20px;padding:10px 0 6px;
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.navbtn{appearance:none;background:none;border:0;padding:4px 0;font-size:17px;color:var(--tint);text-decoration:none;cursor:pointer}
.navbtn[aria-pressed="true"]{font-weight:600}
h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 0 12px;line-height:1.2}

/* 세그먼트 컨트롤 */
.views,.tabs{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:0;margin:0 0 16px}
.views button,.tabs button{flex:1;appearance:none;border:0;background:none;padding:6px 8px;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;color:var(--ink)}
.views button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--seg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.views #v-set{display:none}

/* 요약 카드 */
#inv>header{background:var(--card);border-radius:10px;padding:16px;margin-bottom:22px}
.total{display:flex;align-items:baseline;gap:4px}
.total b{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.total span{font-size:17px;color:var(--muted);font-weight:500}
.split{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:6px;font-size:15px;color:var(--muted)}
.split em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.mix{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--line)}
.mix .r{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px}
.mix .k{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.mix .k em{font-style:normal;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mix .m{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.mix .m i{width:5px;height:14px;border-radius:2.5px;background:var(--c)}
.mix .m i.u{background:transparent;box-shadow:inset 0 0 0 1px var(--c);opacity:.6}

/* 필터 */
nav{margin-bottom:6px}
.types,.locf{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.types::-webkit-scrollbar,.locf::-webkit-scrollbar{display:none}
.types button,.locf button{appearance:none;border:0;flex:none;padding:6px 13px;border-radius:999px;background:var(--fill);font-size:15px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.types button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.types button[aria-pressed="false"]{color:var(--muted)}
.types button[aria-pressed="false"]::before{background:var(--faint)}
.locf button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 그룹 목록 */
section{margin-top:22px}
section h2,.month h2,.dayhead{display:flex;justify-content:space-between;margin:0 0 7px;padding:0 16px;font-size:13px;font-weight:400;color:var(--muted);border:0}
section h2 .edge,.month h2 .edge,.dayhead .edge{font-size:13px;color:var(--muted)}
section.late h2 .edge:first-child{color:var(--late)}
section.soon h2 .edge:first-child{color:var(--soon)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:10px;overflow:hidden}
li{position:relative}
li+li::before{content:"";position:absolute;top:0;left:31px;right:0;border-top:.5px solid var(--line)}
.row{appearance:none;background:none;border:0;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:4px 1fr auto;gap:0 11px;padding:11px 16px;align-items:center}
.row:active,.erow:active{background:var(--fill2)}
li .bar{background:var(--c);border-radius:2px;align-self:stretch;margin:2px 0}
li .body{min-width:0}
li .name{font-size:17px;font-weight:400}
li .name small{font-size:17px;color:var(--ink);margin-left:5px}
li .meta{margin-top:2px;font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none}
li .when{margin-top:2px;font-size:13px;color:var(--muted)}
li.late .when{color:var(--late)} li.soon .when{color:var(--soon)}
li .note{color:var(--muted)}
li .loc{color:var(--tint)}
li .qty{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
li .qty::after{content:"";width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);margin-right:2px}
li .row[aria-expanded="true"] .qty::after{transform:rotate(45deg);margin-top:-4px}
li .qty s{text-decoration:none;color:var(--faint)}
li .qty.bulk{font-size:13px}
li.done .row{opacity:.5}

/* 펼친 행 */
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:2px 16px 14px 31px;font-size:17px}
.act{appearance:none;background:none;border:0;padding:0;font-size:17px;color:var(--tint);cursor:pointer;text-decoration:none}
.act[disabled]{color:var(--faint)}
.act.quiet{color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.locset{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pick{appearance:none;border:0;background:var(--fill);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--tint);color:#fff}
.issued{margin:0 16px 12px 31px;padding:12px 14px;border-radius:10px;background:var(--fill2);display:grid;gap:2px}
.issued b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.issued span{font-size:13px;color:var(--muted)}

/* 입력 폼 */
.form{padding:0 16px 14px 31px;display:grid;gap:12px}
.advice{font-size:13px;color:var(--soon)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;background:var(--fill2);border-radius:10px;padding:2px 12px}
.fgrid label{display:grid;gap:0;font-size:12px;color:var(--muted);padding:8px 0;border-bottom:.5px solid var(--line);min-width:0}
.fgrid .full{grid-column:1/-1;border-bottom:0}
input,textarea{font-size:17px;color:var(--ink);background:transparent;border:0;border-radius:0;padding:3px 0;width:100%;min-width:0;resize:vertical;outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type="date"]{-webkit-appearance:none;appearance:none;min-height:26px;text-align:left}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:.5px solid var(--line)}
.chips button{appearance:none;border:0;background:var(--fill);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--tint);color:#fff}
.fact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}

/* 시트 반영 대기 */
.pending li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;font-size:17px}
.pending li+li::before{left:16px}
.pending li .what .edge{display:block;margin-top:2px}
.pending p{margin:7px 16px 0;font-size:13px;color:var(--muted)}

/* 아래 정보 */
footer{margin-top:26px;display:grid;gap:8px;padding:0 16px;font-size:13px;color:var(--muted)}
footer .src{display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:var(--ok)}
.msg{color:var(--ink)}
footer .act{font-size:13px}
.empty{background:var(--card);border-radius:10px;padding:16px;color:var(--muted);font-size:15px;margin:0}

/* 기록 */
.hstats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:10px;padding:14px 4px;margin-bottom:16px}
.hstats div{display:grid;justify-items:center;gap:2px}
.hstats div+div{border-left:.5px solid var(--line)}
.hstats b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.hstats span{font-size:12px;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;margin-bottom:12px}
.find label{display:none}
.find input{padding:8px 0;font-size:17px}
.find button{appearance:none;border:0;background:none;color:var(--tint);font-size:15px;cursor:pointer;flex:none}
.lm{margin:0 0 6px}
.month{margin-top:22px}
.entry{position:relative;background:var(--card)}
.month h2+.entry,.dayhead+.entry{border-radius:10px 10px 0 0}
.entry:last-child,.entry:has(+ :not(.entry)){border-radius:0 0 10px 10px}
.month h2+.entry:last-child,.dayhead+.entry:last-child{border-radius:10px}
.entry+.entry::before{content:"";position:absolute;top:0;left:70px;right:0;border-top:.5px solid var(--line)}
.erow{appearance:none;background:none;border:0;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:40px 4px 1fr auto;gap:0 11px;padding:11px 16px;align-items:center}
.entry .dt{font-size:22px;font-weight:600;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.entry .dt small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px}
.entry .bar{background:var(--c);border-radius:2px;align-self:stretch}
.entry .body{min-width:0}
.entry .name{font-size:17px}
.entry .name small{font-size:17px;margin-left:5px}
.entry .meta{margin-top:2px;font-size:13px;color:var(--muted)}
.entry .when{margin-top:1px;font-size:13px;color:var(--muted)}
.no{display:inline-block;font-size:13px;font-weight:600;color:var(--tint);margin-right:6px;font-variant-numeric:tabular-nums}
.st{display:grid;justify-items:end;gap:3px}
.stg{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.stg.lab{background:color-mix(in srgb,var(--c41) 18%,transparent);color:var(--c41)}
.stg.scan{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.sheet{font-size:11px;color:var(--soon)}
.detail{padding:0 16px 14px 70px;display:grid;gap:12px}
.tag{display:grid;gap:2px}
.tag b{font-size:28px;font-weight:700;color:var(--tint);font-variant-numeric:tabular-nums}
.tag span{font-size:13px;color:var(--muted)}
.flow{display:flex;background:var(--fill);border-radius:8px;padding:2px;font-size:13px}
.flow b{flex:1;text-align:center;padding:5px 4px;border-radius:6px;font-weight:400;color:var(--muted)}
.flow b.on{background:var(--seg);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.flow i{display:none}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.labin{display:flex;gap:10px;align-items:center;background:var(--fill2);border-radius:10px;padding:4px 12px}
.labin input{flex:1}
.entry .form{padding-left:70px}

/* 달력 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.cal-head .edge{font-size:17px;font-weight:600;color:var(--ink)}
.cal-head button{appearance:none;border:0;background:none;color:var(--tint);font-size:22px;padding:0 8px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card);border-radius:10px;padding:6px 4px}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0 6px}
.cal .wd.sun,.cal .d.sun .n{color:var(--late)}
.cal .d,.cal .blank{min-height:52px}
.cal .d{appearance:none;border:0;background:none;padding:4px 0;display:grid;align-content:start;justify-items:center;gap:4px;cursor:pointer}
.cal .d .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal .d.today .n{color:var(--tint);font-weight:600}
.cal .d[aria-pressed="true"] .n{background:var(--tint);color:#fff;font-weight:600}
.cal .mk{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:30px}
.cal .mk i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal .mk em{font-style:normal;font-size:9px;color:var(--muted)}
.dayhead{margin-top:22px}

/* 설정 */
.setup{display:grid;gap:8px}
.setup h2{margin:14px 16px 0;font-size:13px;font-weight:400;color:var(--muted)}
.setup .card{background:var(--card);border-radius:10px;overflow:hidden}
.setup label{display:grid;gap:2px;padding:10px 16px;font-size:12px;color:var(--muted)}
.setup label+label{border-top:.5px solid var(--line)}
.setup .rowbtn{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:17px;color:var(--tint);background:none;border:0;width:100%;text-align:left;text-decoration:none;cursor:pointer}
.setup .rowbtn+.rowbtn{border-top:.5px solid var(--line)}
.setup p{margin:0 16px;font-size:13px;color:var(--muted)}
.setup .ok{color:var(--ok)} .setup .bad{color:var(--late)}
button:focus-visible,a:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.row,.erow{transition:background .15s}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar"><a id="sheetlink" class="navbtn" href="#" target="_blank" rel="noopener" hidden>시트 열기</a><button id="v-set" class="navbtn" data-v="set" aria-pressed="false">설정</button></div>
  <h1 id="ttl">필름정리</h1><span id="today" hidden></span>
  <div class="views" role="group" aria-label="보기">
    <button id="v-inv" data-v="inv" aria-pressed="true">재고</button>
    <button id="v-log" data-v="log" aria-pressed="false">사용 기록</button>
  </div>

  <div id="inv">
    <header>
      <div class="total"><b id="total">0</b><span>롤</span></div>
      <div class="split" id="split"></div>
      <div class="mix" id="mix"></div>
    </header>
    <nav>
      <div class="tabs" role="group" aria-label="판형">
        <button id="f-all" data-fmt="all" aria-pressed="true">전체</button>
        <button id="f-135" data-fmt="135" aria-pressed="false">135</button>
        <button id="f-120" data-fmt="120" aria-pressed="false">120</button>
      </div>
      <div class="types" id="types" role="group" aria-label="유형"></div>
      <div class="locf" id="locf" role="group" aria-label="보관 위치" hidden></div>
    </nav>
    <main id="list"></main>
    <div id="pending"></div>
  </div>

  <div id="log" hidden></div>
  <div id="set" hidden></div>

  <footer>
    <div class="src"><span class="dot" id="dot"></span><span id="src">저장된 사본을 보여주는 중</span></div>
    <div id="action" hidden></div>
  </footer>
</div>

<script>
const TYPES=[
  {k:"B&W",label:"흑백",c:"var(--bw)"},
  {k:"C41",label:"C-41",c:"var(--c41)"},
  {k:"E6",label:"E-6",c:"var(--e6)"},
  {k:"ECN-2",label:"ECN-2",c:"var(--ecn)"}];
const typeOf=t=>TYPES.find(x=>x.k===t)||{k:t,label:t||"—",c:"var(--faint)"};
const LOCS=["냉장","냉동","실온"];
const STAGES={shot:"현상 전",lab:"현상 맡김",scan:"스캔 완료"};
const ISOS=[6,8,10,12,16,20,25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,6400];
const WD="일월화수목금토";

const LS={get(k,d){try{const v=localStorage.getItem("film-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){localStorage.setItem("film-"+k,JSON.stringify(v))}};
const CACHE=LS.get("sheet",null);
const toRow=a=>({fmt:a[0],exp:a[1],brand:a[2],name:a[3],iso:a[4],qty:parseInt(a[5],10),expiry:a[6]||"",type:a[7],note:a[8]||""});
function withKeys(rows){const seen={};return rows.map(r=>{const b=[r.fmt,r.brand,r.name,r.iso,r.expiry].join("|");seen[b]=(seen[b]||0)+1;return{...r,key:b+"#"+seen[b]}})}

const today=new Date();
let state={rows:CACHE&&Array.isArray(CACHE.rows)?withKeys(CACHE.rows.map(toRow)):[],fmt:"all",types:new Set(TYPES.map(t=>t.k)),loc:"all",
  open:null,logs:[],locs:{},canUse:false,busy:false,view:"inv",logMode:"list",
  cal:{y:today.getFullYear(),m:today.getMonth()},calDay:null,openLog:null,form:null,draft:{},labDraft:"",issued:null,q:""};
try{const s=JSON.parse(localStorage.getItem("film-view")||"null");if(s){state.fmt=s.fmt||"all";if(Array.isArray(s.types)&&s.types.length)state.types=new Set(s.types);if(s.loc)state.loc=s.loc;if(s.logMode)state.logMode=s.logMode}}catch(e){}
const save=()=>{try{localStorage.setItem("film-view",JSON.stringify({fmt:state.fmt,types:[...state.types],loc:state.loc,logMode:state.logMode}))}catch(e){}};

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const label=r=>r.name?`${r.brand} ${r.name}`:`${r.brand} ${r.iso||""}`.trim();
const hashKey=k=>{let h=5381;for(const ch of k)h=((h*33)^ch.codePointAt(0))>>>0;return"k"+h.toString(36)};

const NOWM=today.getFullYear()*12+today.getMonth()+1;
const parseYM=s=>{const m=/^(\d{4})\.(\d{1,2})/.exec(s||"");return m?{y:+m[1],m:+m[2]}:null};
function status(r){
  const p=parseYM(r.expiry);
  if(!p){const extra=(/\((.+)\)/.exec(r.expiry)||[])[1];return{g:"unknown",sort:1e9,text:r.expiry===""?"":"기한 미상"+(extra?" · "+extra:"")}}
  const d=p.y*12+p.m-NOWM, ym=`${p.y}.${pad(p.m)}`;
  const span=n=>n>=12?`${Math.floor(n/12)}년${n%12?" "+(n%12)+"개월":""}`:`${n}개월`;
  if(d<0)return{g:"late",sort:d,text:`${ym} · ${span(-d)} 지남`};
  if(d===0)return{g:"soon",sort:d,text:`${ym} · 이번 달까지`};
  if(d<=6)return{g:"soon",sort:d,text:`${ym} · ${d}개월 남음`};
  return{g:"ok",sort:d,text:`${ym} · ${span(d)} 남음`};
}
const GROUPS=[["late","기한 지남"],["soon","6개월 안에"],["ok","여유 있음"],["unknown","기한 미상"],["done","다 쓴 필름"]];

/* EI: 노출 설정 */
const nearestIso=v=>ISOS.reduce((a,b)=>Math.abs(Math.log2(b/v))<Math.abs(Math.log2(a/v))?b:a);
function stopText(d){const t=Math.round(Math.abs(d)*3),w=Math.floor(t/3),f=["","⅓","⅔"][t%3];return(w?w:"")+f||"0"}
function eiLabel(ei,iso){
  ei=+ei;iso=+iso;if(!ei||!iso)return"";
  const d=Math.log2(iso/ei);
  if(Math.abs(d)<0.17)return"박스 감도";
  return d>0?`${stopText(d)}스탑 더 노출 · 현상은 그대로`:`${stopText(d)}스탑 푸시 · 현상소에 알려야 해요`;
}
function advice(r){
  const p=parseYM(r.expiry),iso=+r.iso;if(!p||!iso)return null;
  const mo=NOWM-(p.y*12+p.m);if(mo<12)return null;
  const y=Math.floor(mo/12);
  const stops=y<5?0:Math.min(3,Math.max(1,Math.round(y/10)));
  const slide=r.type==="E6";
  if(!stops)return{ei:iso,text:`기한 ${y}년 지남. 박스 감도 그대로 써도 무난한 편이에요.`};
  const ei=nearestIso(iso/2**stops);
  return{ei,text:`기한 ${y}년 지남. 흔히 10년에 1스탑 정도 더 노출해요 → EI ${ei} 근처.${slide?" 슬라이드는 관용도가 낮아 앞뒤로 나눠 찍는 걸 권해요.":""}`};
}

/* 사용 기록 ↔ 시트 */
function pendingFor(r){
  if(!(r.qty>0))return[];
  const logs=state.logs.filter(l=>l.key===r.key&&l.base>=r.qty).sort((a,b)=>a.at<b.at?-1:1);
  if(!logs.length)return[];
  const applied=Math.max(0,Math.max(...logs.map(l=>l.base))-r.qty);
  return logs.slice(applied).slice(-r.qty);
}
function isPending(log){const r=state.rows.find(x=>x.key===log.key);return!!r&&pendingFor(r).some(l=>l.id===log.id)}
function enrich(r){const p=pendingFor(r);return{...r,used:p.length,left:r.qty>0?r.qty-p.length:r.qty,pend:p,loc:state.locs[r.key]||""}}
function nextNo(at){const yy=pad(new Date(at).getFullYear()%100);const max=Math.max(0,...state.logs.filter(l=>typeof l.no==="string"&&l.no.startsWith(yy+"-")).map(l=>parseInt(l.no.slice(3),10)||0));return`${yy}-${String(max+1).padStart(3,"0")}`}
const normNo=q=>{const m=/^(?:(\d{2})\s*[-.\s]\s*)?0*(\d{1,4})$/.exec(q.trim());return m?{yy:m[1]||null,n:+m[2]}:null};
function matches(l,q){
  const nq=normNo(q);
  if(nq&&l.no){const[yy,n]=l.no.split("-");if(+n===nq.n&&(!nq.yy||nq.yy===yy))return true}
  const hay=[l.no,l.brand,l.name,l.label,l.cam,l.place,l.note,l.lab,l.iso&&`iso ${l.iso}`].filter(Boolean).join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
const dayLabel=iso=>{const t=new Date(iso);return`${t.getMonth()+1}월 ${t.getDate()}일`};
const cams=()=>[...new Set([...state.logs].sort((a,b)=>a.at<b.at?1:-1).map(l=>l.cam).filter(Boolean))];
const places=()=>[...new Set([...state.logs].sort((a,b)=>a.at<b.at?1:-1).map(l=>l.place).filter(Boolean))];

  const byFmt=all.filter(r=>state.fmt==="all"||r.fmt===state.fmt);
  const counted=byFmt.filter(r=>r.left>0);
  const sum=a=>a.reduce((s,r)=>s+r.left,0);
  const total=sum(counted);
  $("total").textContent=total;
  const bw=sum(counted.filter(r=>r.type==="B&W"));
  const parts=[];
  if(state.fmt==="all")parts.push(`135 <em>${sum(counted.filter(r=>r.fmt==="135"))}</em>`,`120 <em>${sum(counted.filter(r=>r.fmt==="120"))}</em>`);

  if(!state.rows.length)$("list").innerHTML=`<p class="empty">아직 시트를 불러오지 않았어요. 설정에서 시트 연결 주소와 키를 넣어 주세요.</p>`;
  else if(!shown.length)$("list").innerHTML=`<p class="empty">선택한 조건에 맞는 필름이 없어요.</p>`;

    return`<section class="${g}"><h2><span class="edge">${glabel}</span><span class="edge n">${n}롤</span></h2><ul>${items.map(({r,s})=>{

      const k=`${y}-${pad(m+1)}-${pad(d)}`,ls=byDay[k]||[],dow=new Date(y,m,d).getDay();
      const mk=ls.slice(0,6).map(l=>`<i style="--c:${typeOf(l.type).c}"></i>`).join("")+(ls.length>6?`<em>+${ls.length-6}</em>`:"");
      html+=`<button class="d${ls.length?" has":""}${k===tk?" today":""}${dow===0?" sun":""}" id="d-${k}" data-day="${k}" aria-pressed="${state.calDay===k}" aria-label="${m+1}월 ${d}일 ${ls.length}롤"><span class="n">${d}</span>${ls.length?`<span class="mk">${mk}</span>`:""}</button>`;
    }
    html+=`</div>`;
    const sel=state.calDay&&state.calDay.startsWith(`${y}-${pad(m+1)}`)?state.calDay:null;
    const list=sel?(byDay[sel]||[]):monthLogs;
    const head=sel?(()=>{const d=new Date(sel+"T12:00");return`${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`})():`${m+1}월 전체`;
    html+=`<div class="dayhead"><span class="edge">${head}</span><span class="edge n">${list.length}롤</span></div>`;
    html+=list.length?list.map(entryHtml).join(""):`<p class="empty">${sel?"이날은 기록이 없어요.":"이 달에는 기록이 없어요."}</p>`;
  }else{
    if(!logs.length)html+=`<p class="empty">아직 기록이 없어요. 재고에서 필름을 누르고 "한 롤 썼어요"를 누르면 여기에 날짜별로 쌓여요.</p>`;
    else html+=[...new Set(logs.map(l=>ymKey(l.at)))].map(mo=>{
      const items=logs.filter(l=>ymKey(l.at)===mo);
      return`<section class="month"><h2><span class="edge">${mo}</span><span class="edge n">${items.length}롤</span></h2>${items.map(entryHtml).join("")}</section>`;
    }).join("");
  }
  $("log").innerHTML=html;
}

/* ---------- 동작 ---------- */
let usedCol=null,locCol=null;
function setAction(h){const a=$("action");a.hidden=!h;a.innerHTML=h||""}
async function write(fn,after){
  if(!usedCol||state.busy)return;
  state.busy=true;render();
  try{await fn();if(after)after()}
  catch(e){
    const msg=e&&e.code==="quota_exceeded"?"기록 공간이 가득 찼어요.":e&&e.code==="invalid_argument"?"기록은 이 페이지 주인만 남길 수 있어요.":"저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.";
    setAction(`<span class="msg">${msg}</span>`);
  }finally{state.busy=false;render()}
}
const atFromDate=ds=>{if(!ds||ds===ymd(new Date()))return new Date().toISOString();const d=new Date(ds+"T12:00");return isNaN(d)?new Date().toISOString():d.toISOString()};
const cleanEi=v=>{const n=parseInt(String(v||"").replace(/\D/g,""),10);return n>0?n:null};

function openUse(key){
  const r=state.rows.find(x=>x.key===key);if(!r)return;
  const ad=advice(r);
  state.form={mode:"new",key};state.draft={date:ymd(new Date()),ei:String(ad?ad.ei:(r.iso||"")),cam:cams()[0]||"",place:"",note:""};
  render();setTimeout(()=>{const n=$("f-cam");if(n&&!n.value)n.focus({preventScroll:true})},0);
}
function openEdit(id){
  const l=state.logs.find(x=>x.id===id);if(!l)return;
  state.form={mode:"edit",id};state.draft={date:ymd(new Date(l.at)),ei:l.ei?String(l.ei):"",cam:l.cam||"",place:l.place||"",note:l.note||""};render();
}
function saveForm(){
  const f=state.form,d=state.draft;if(!f)return;
  const fields={cam:(d.cam||"").trim(),place:(d.place||"").trim(),note:(d.note||"").trim(),ei:cleanEi(d.ei)};
  if(f.mode==="new"){
    const r=state.rows.find(x=>x.key===f.key);if(!r)return;
    const at=atFromDate(d.date),no=nextNo(at);
    write(()=>usedCol.add({no,key:r.key,base:r.qty,at,label:label(r),fmt:r.fmt,brand:r.brand,name:r.name,iso:r.iso,type:r.type,expiry:r.expiry,stage:"shot",...fields}),
      ()=>{state.form=null;state.issued={key:r.key,no}});
  }else{
    const l=state.logs.find(x=>x.id===f.id);if(!l)return;
    const upd={...fields};if(d.date&&d.date!==ymd(new Date(l.at)))upd.at=atFromDate(d.date);
    write(()=>usedCol.doc(f.id).update(upd),()=>{state.form=null});
  }
}
function undoRoll(key){const r=state.rows.find(x=>x.key===key);if(!r)return;const p=pendingFor(r);if(p.length)write(()=>usedCol.doc(p[p.length-1].id).delete())}
function removeLog(id){write(()=>usedCol.doc(id).delete(),()=>{if(state.openLog===id)state.openLog=null})}
function setStage(id,stage){
  const upd={stage};
  if(stage==="lab"){upd.lab=(state.labDraft||"").trim()||(state.logs.find(x=>x.id===id)||{}).lab||"";upd.labAt=new Date().toISOString()}
  if(stage==="scan")upd.scanAt=new Date().toISOString();
  write(()=>usedCol.doc(id).update(upd),()=>{state.labDraft=""});
}
function setLoc(key,loc){
  if(!locCol)return;const ref=locCol.doc(hashKey(key));
  write(()=>state.locs[key]===loc?ref.delete():ref.set({key,loc}));
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const ds=b.dataset;
  if(ds.v){state.view=ds.v;state.form=null;if(ds.v!=="inv")location.hash=ds.v;else history.replaceState(null,"",location.pathname+location.search);render();return}
  if(ds.fmt){state.fmt=ds.fmt;save();render();return}
  if(ds.t){const k=ds.t;if(state.types.has(k)&&state.types.size>1)state.types.delete(k);else state.types.add(k);save();render();return}
  if(ds.locf){state.loc=ds.locf;save();render();return}
  if(ds.row!==undefined){const k=ds.row;state.open=state.open===k?null:k;state.issued=null;if(state.form&&state.form.mode==="new")state.form=null;render();return}
  if(ds.use){openUse(ds.use);return}
  if(ds.undo){undoRoll(ds.undo);return}
  if(ds.setloc){setLoc(ds.key,ds.setloc);return}
  if(ds.ei){state.draft.ei=ds.ei;render();return}
  if(ds.save!==undefined){saveForm();return}
  if(ds.cancel!==undefined){state.form=null;render();return}
  if(ds.log){state.openLog=state.openLog===ds.log?null:ds.log;if(state.form&&state.form.mode==="edit")state.form=null;state.labDraft="";render();return}
  if(ds.stage){setStage(ds.id,ds.stage);return}
  if(ds.edit){openEdit(ds.edit);return}
  if(ds.del){removeLog(ds.del);return}
  if(ds.qclear!==undefined){state.q="";render();const q=$("q");if(q)q.focus();return}
  if(ds.mode){state.logMode=ds.mode;save();render();return}
  if(ds.cal){let{y,m}=state.cal;m+=+ds.cal;if(m<0){m=11;y--}if(m>11){m=0;y++}state.cal={y,m};state.calDay=null;render();return}
  if(ds.day){state.calDay=state.calDay===ds.day?null:ds.day;render();return}
});
document.addEventListener("input",e=>{
  const el=e.target,f=el.dataset&&el.dataset.field;
  if(f){state.draft[f]=el.value;if(f==="ei"){const h=$("ei-hint"),fm=state.form;if(h&&fm){const iso=fm.mode==="new"?+(state.rows.find(x=>x.key===fm.key)||{}).iso:+(state.logs.find(x=>x.id===fm.id)||{}).iso;h.textContent=eiLabel(el.value,iso)}}}
  if(el.id==="l-lab")state.labDraft=el.value;
  if(el.id==="q"){state.q=el.value;if(e.isComposing)return;const hits=state.q.trim()?state.logs.filter(l=>matches(l,state.q)):[];state.openLog=hits.length===1?hits[0].id:state.openLog;render()}
});
document.addEventListener("compositionend",e=>{if(e.target.id==="q")e.target.dispatchEvent(new Event("input",{bubbles:true}))});
const viewFromHash=()=>({"#log":"log","#set":"set"})[location.hash]||"inv";
window.addEventListener("hashchange",()=>{state.view=viewFromHash();render()});

$("today").textContent=`${today.getFullYear()}.${pad(today.getMonth()+1)}.${pad(today.getDate())}`;
const fmtTime=ms=>{const t=new Date(ms);return`${t.getMonth()+1}월 ${t.getDate()}일 ${pad(t.getHours())}:${pad(t.getMinutes())}`};
$("src").textContent=CACHE?`저장된 사본 · ${fmtTime(Date.parse(CACHE.at))} 기준`:"아직 시트를 불러오지 않았어요";
state.view=viewFromHash();
render();

/* ---------- 이 폰에 저장하는 기록 ---------- */
const Store={
  subs:{},
  read(n){return LS.get("db-"+n,{})},
  write(n,o){LS.set("db-"+n,o);this.emit(n)},
  emit(n){const o=this.read(n);const snap={docs:Object.keys(o).map(id=>({id,data:()=>o[id]})),metadata:{fromCache:false}};(this.subs[n]||[]).forEach(f=>f(snap))},
  collection(n){const S=this;return{
    async add(d){const o=S.read(n),id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);o[id]=d;S.write(n,o);return{id}},
    doc(id){return{
      async set(d){const o=S.read(n);o[id]=d;S.write(n,o)},
      async update(d){const o=S.read(n);if(!o[id])throw{code:"invalid_argument"};o[id]={...o[id],...d};S.write(n,o)},
      async delete(){const o=S.read(n);delete o[id];S.write(n,o)}}},
    onSnapshot(f){(S.subs[n]=S.subs[n]||[]).push(f);setTimeout(()=>S.emit(n),0);return()=>{}}
  }}
};
state.canUse=true;
usedCol=Store.collection("used");locCol=Store.collection("loc");
usedCol.onSnapshot(snap=>{state.logs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(l=>typeof l.key==="string"&&typeof l.base==="number"&&typeof l.at==="string");render()});
locCol.onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const v=d.data();if(v&&typeof v.key==="string"&&LOCS.includes(v.loc))m[v.key]=v.loc});state.locs=m;render()});
window.addEventListener("storage",e=>{if(e.key==="film-db-used")Store.emit("used");if(e.key==="film-db-loc")Store.emit("loc")});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- 구글 시트 (Apps Script) ---------- */
function setSource(live,text){$("dot").className="dot"+(live?" live":"");$("src").textContent=text}
function rowsFrom(sheets){
  const out=[];
  for(const name of ["135","120"]){
    const t=sheets&&sheets[name];if(!Array.isArray(t)||!t.length)continue;
    const head=t[0].map(h=>String(h).trim());
    const col=(cells,k)=>{const i=head.findIndex(h=>h.startsWith(k));return i<0?"":String(cells[i]==null?"":cells[i]).trim()};
    for(const cells of t.slice(1)){
      if(!/^(135|120)$/.test(col(cells,"판형"))||!col(cells,"브랜드"))continue;
      out.push([col(cells,"판형"),col(cells,"매수"),col(cells,"브랜드"),col(cells,"필름명"),col(cells,"감도"),col(cells,"수량"),col(cells,"유통기한"),col(cells,"유형"),col(cells,"비고")]);
    }
  }
  return out;
}
async function fetchSheet(cfg){
  const res=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:cfg.key}),redirect:"follow",cache:"no-store"});
  if(!res.ok)throw{code:"http",status:res.status};
  let j;try{j=await res.json()}catch(e){throw{code:"format"}}
  if(!j.ok)throw{code:j.error||"server"};
  const rows=rowsFrom(j.sheets);
  if(!rows.length)throw{code:"empty"};
  return{rows,at:j.at||new Date().toISOString(),sheetUrl:j.sheetUrl||""};
}
const errText=e=>({bad_key:"키가 맞지 않아요. 스크립트 속성의 KEY와 똑같이 넣어 주세요.",http:"주소에 연결하지 못했어요. 웹 앱 URL이 맞는지, 배포에서 액세스를 '모든 사용자'로 했는지 확인해 주세요.",format:"응답을 읽지 못했어요. 웹 앱 URL(…/exec)을 넣었는지 확인해 주세요.",empty:"시트에서 필름 행을 찾지 못했어요. 135, 120 시트 이름과 '판형' 머리글을 확인해 주세요."})[e&&e.code]||"인터넷 연결을 확인하고 다시 불러와 주세요.";
let loading=false;
async function loadSheet(manual){
  const cfg=LS.get("cfg",null);
  if(!cfg||!cfg.url||!cfg.key){setSource(false,"시트 연결이 아직 없어요");setAction(`<button class="act" data-v="set">설정에서 연결하기</button>`);return false}
  if(loading)return false;loading=true;
  if(manual)setAction(`<span class="msg">불러오는 중…</span>`);
  try{
    const r=await fetchSheet(cfg);
    LS.set("sheet",r);state.rows=withKeys(r.rows.map(toRow));
    if(r.sheetUrl){$("sheetlink").href=r.sheetUrl;$("sheetlink").hidden=false}
    setSource(true,`구글 시트 · ${fmtTime(Date.parse(r.at))} 기준`);setAction(`<button class="act quiet" id="reload">다시 불러오기</button>`);
    render();return true;
  }catch(e){
    const c=LS.get("sheet",null);
    setSource(false,c?`저장된 사본 · ${fmtTime(Date.parse(c.at))} 기준`:"시트를 불러오지 못했어요");
    setAction(`<span class="msg">${errText(e)}</span> <button class="act" id="reload">다시 불러오기</button>`);
    return false;
  }finally{loading=false}
}
document.addEventListener("click",e=>{if(e.target.id==="reload")loadSheet(true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const c=LS.get("sheet",null);if(!c||Date.now()-Date.parse(c.at)>5*60*1000)loadSheet(false)}});
{const c=LS.get("sheet",null);if(c&&c.sheetUrl){$("sheetlink").href=c.sheetUrl;$("sheetlink").hidden=false}}

/* ---------- 설정 ---------- */
let setMsg="";
function renderSet(){
  const cfg=LS.get("cfg",{url:"",key:""}),nUsed=state.logs.length;
  const sheetUrl=(LS.get("sheet",{})||{}).sheetUrl||"";
  $("set").innerHTML=`<div class="setup">
    ${sheetUrl?`<div class="card"><a class="rowbtn" href="${esc(sheetUrl)}" target="_blank" rel="noopener">구글 시트 열기</a></div>`:""}
    <h2>시트 연결</h2>
    <div class="card">
      <label>웹 앱 URL<input id="s-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.url)}"></label>
      <label>키<input id="s-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(cfg.key)}"></label>
    </div>
    <div class="card"><button class="rowbtn" id="s-save">저장하고 불러오기</button></div>
    ${setMsg?`<p>${setMsg}</p>`:""}
    <h2>기록 백업</h2>
    <div class="card">
      <button class="rowbtn" id="s-export">백업 파일 저장</button>
      <label class="rowbtn" style="font-size:17px;color:var(--tint)">백업 불러오기<input id="s-import" type="file" accept="application/json,.json" hidden></label>
    </div>
    <p>사용 기록 ${nUsed}개와 보관 위치는 이 폰에만 저장돼요. 폰을 바꾸기 전에 백업해 두세요.</p>
  </div>`;
}
document.addEventListener("click",async e=>{
  if(e.target.id==="s-save"){
    const url=$("s-url").value.trim(),key=$("s-key").value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){setMsg=`<span class="hint bad">script.google.com 으로 시작하는 웹 앱 주소를 넣어 주세요.</span>`;renderSet();return}
    if(!key){setMsg=`<span class="hint bad">키를 넣어 주세요.</span>`;renderSet();return}
    LS.set("cfg",{url,key});setMsg=`<span class="hint">확인하는 중…</span>`;renderSet();
    const ok=await loadSheet(true);
    setMsg=ok?`<span class="hint ok">연결됐어요. 필름 ${state.rows.length}종을 불러왔어요.</span>`:`<span class="hint bad">${esc($("action").textContent.replace("다시 불러오기","").trim())}</span>`;
    renderSet();
  }
  if(e.target.id==="s-export"){
    const data={app:"film-app",v:1,at:new Date().toISOString(),used:Store.read("used"),loc:Store.read("loc")};
    const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
    const name=`film-backup-${ymd(new Date())}.json`;
    try{if(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:"application/json"})]})){await navigator.share({files:[new File([blob],name,{type:"application/json"})],title:name});return}}catch(err){if(err&&err.name==="AbortError")return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="s-import"||!e.target.files[0])return;
  try{
    const j=JSON.parse(await e.target.files[0].text());
    if(j.app!=="film-app"||typeof j.used!=="object")throw 0;
    const cur=Store.read("used");Object.assign(cur,j.used);Store.write("used",cur);
    const loc=Store.read("loc");Object.assign(loc,j.loc||{});Store.write("loc",loc);
    setMsg="";alert(`기록 ${Object.keys(j.used).length}개를 불러왔어요.`);
  }catch(err){alert("필름정리 백업 파일이 아니에요.")}
  renderSet();
});

render();
loadSheet(false);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
